[project]
name = "uavplan"
version = "0.1.0"
description = "Optimizing Routing, Task Allocation, and Energy Management in Collaborative UAV Systems (simulation study)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "networkx>=3.2",
    "ortools>=9.10",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "sqlmodel>=0.0.16",
    "websockets>=12",
]

[project.optional-dependencies]
streamlit = ["streamlit>=1.33"]

[project.scripts]
uavplan = "uavplan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=4.100",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-networkx>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uavplan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
markers = ["slow: long-running tests (solvers, large property sweeps)"]

[tool.coverage.run]
source = ["uavplan.core"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\.$"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E731", "E741"]
"src/uavplan/experiments/*" = ["E501"]
"src/uavplan/api/export_openapi.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/uavplan/core"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["scipy.*", "ortools.*"]
ignore_missing_imports = true
